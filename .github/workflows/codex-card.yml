name: Update Codex activity card

on:
  push:
    branches:
      - agent/codex-usage-card
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-activity-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test card generator
        run: python -m unittest discover -s tests -v

      - name: Query Tempo and generate card
        env:
          GRAFANA_TEMPO_URL: ${{ secrets.GRAFANA_TEMPO_URL }}
          GRAFANA_TEMPO_USER: ${{ secrets.GRAFANA_TEMPO_USER }}
          GRAFANA_TEMPO_TOKEN: ${{ secrets.GRAFANA_TEMPO_TOKEN }}
        run: python scripts/update_codex_card.py

      - name: Commit updated activity
        run: |
          if git diff --quiet -- profile/codex-stats.json profile/codex-card.svg; then
            echo "No Codex activity changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/codex-stats.json profile/codex-card.svg
          git commit -m "Update Codex activity card"
          git pull --rebase origin main
          git push
