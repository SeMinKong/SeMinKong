name: Refresh profile terrain

on:
  push:
    branches:
      - main
    paths:
      - profile-3d-settings.json
      - .github/workflows/profile-3d.yml
      - scripts/staticize-profile-svg.mjs
  schedule:
    - cron: "17 18 * * *" # 03:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-terrain
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate theme-aware 3D contribution terrain
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./profile-3d-settings.json
          MAX_REPOS: 100

      - name: Create GitHub-compatible static SVG
        run: node scripts/staticize-profile-svg.mjs

      - name: Commit refreshed terrain
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-physical-ai-static.svg
          if git diff --cached --quiet; then
            echo "Profile terrain is already current."
            exit 0
          fi
          git commit -m "chore: refresh profile terrain [skip ci]"
          git push

