<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Sense, perceive, reason, control, act, and learn system loop</title>
  <desc id="description">A five-stage Physical AI pipeline from camera, MRI, and language signals through perception, learning, ROS 2 safety control, robot motion, and evaluation feedback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill"/>
    </marker>
    <style>
      :root {
        color-scheme: light dark;
      }
      .canvas { fill: #f6f8fa; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
      .card-highlight { fill: #eefaf6; stroke: #0a8f70; stroke-width: 2; }
      .title { fill: #24292f; font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .stage { fill: #24292f; font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: #57606a; font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .number { fill: #ffffff; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .number-bg { fill: #0a8f70; }
      .number-bg-alt { fill: #76b900; }
      .flow { fill: none; stroke: #57606a; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #0a8f70; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .feedback-label { fill: #0a8f70; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .arrow-fill { fill: #57606a; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
        .card { fill: #161b22; stroke: #30363d; }
        .card-highlight { fill: #102b26; stroke: #50e3c2; }
        .title, .stage { fill: #f0f6fc; }
        .detail { fill: #8b949e; }
        .number-bg { fill: #0a8f70; }
        .number-bg-alt { fill: #76b900; }
        .flow { stroke: #8b949e; }
        .feedback { stroke: #50e3c2; }
        .feedback-label { fill: #50e3c2; }
        .arrow-fill { fill: #8b949e; }
      }
    </style>
  </defs>

  <rect class="canvas" x="20" y="20" width="960" height="720" rx="28"/>
  <text class="title" x="80" y="72">INPUT-TO-ACTION SYSTEM LOOP</text>

  <g>
    <rect class="card" x="90" y="105" width="820" height="100" rx="20"/>
    <circle class="number-bg" cx="150" cy="155" r="28"/>
    <text class="number" x="150" y="156">01</text>
    <text class="stage" x="210" y="145">SENSE</text>
    <text class="detail" x="210" y="178">Camera · MRI · Language</text>
  </g>

  <path class="flow" d="M 500 205 L 500 229"/>

  <g>
    <rect class="card" x="90" y="230" width="820" height="100" rx="20"/>
    <circle class="number-bg" cx="150" cy="280" r="28"/>
    <text class="number" x="150" y="281">02</text>
    <text class="stage" x="210" y="270">PERCEIVE</text>
    <text class="detail" x="210" y="303">MediaPipe · OpenCV · YOLO</text>
  </g>

  <path class="flow" d="M 500 330 L 500 354"/>

  <g>
    <rect class="card-highlight" x="90" y="355" width="820" height="100" rx="20"/>
    <circle class="number-bg-alt" cx="150" cy="405" r="28"/>
    <text class="number" x="150" y="406">03</text>
    <text class="stage" x="210" y="395">REASON &amp; LEARN</text>
    <text class="detail" x="210" y="428">PyTorch · RL · LangGraph · Local LLM</text>
  </g>

  <path class="flow" d="M 500 455 L 500 479"/>

  <g>
    <rect class="card" x="90" y="480" width="820" height="100" rx="20"/>
    <circle class="number-bg" cx="150" cy="530" r="28"/>
    <text class="number" x="150" y="531">04</text>
    <text class="stage" x="210" y="520">CONTROL &amp; PROTECT</text>
    <text class="detail" x="210" y="553">ROS 2 · Edge runtime · Command Guard</text>
  </g>

  <path class="flow" d="M 500 580 L 500 604"/>

  <g>
    <rect class="card-highlight" x="90" y="605" width="820" height="100" rx="20"/>
    <circle class="number-bg-alt" cx="150" cy="655" r="28"/>
    <text class="number" x="150" y="656">05</text>
    <text class="stage" x="210" y="645">ACT &amp; MEASURE</text>
    <text class="detail" x="210" y="678">Robot motion · rosbag2 · Evaluation</text>
  </g>

  <path class="feedback" d="M 910 655 C 957 655 957 405 910 405"/>
  <text class="feedback-label" x="942" y="552" transform="rotate(-90 942 552)">FEEDBACK</text>
</svg>

