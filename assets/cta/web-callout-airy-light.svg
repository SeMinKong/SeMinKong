<svg xmlns="http://www.w3.org/2000/svg" width="720" height="248" viewBox="0 0 720 248" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="web-title web-desc">
  <title id="web-title">Web 포트폴리오 바로가기</title>
  <desc id="web-desc">손으로 그린 W, E, B 아래의 손그림 강조선이 포트폴리오 버튼을 둘러쌉니다.</desc>
  <style>
    .ink{fill:none;stroke:#26344A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pencil{fill:none;stroke:#7B8798;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.burst{fill:none;stroke:#08715A;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.96}.panel{fill:#E8F4F0;stroke:#08715A;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}.label{fill:#26344A;font:700 26px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.15s cubic-bezier(.2,.7,.2,1) .12s forwards}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
  </style>

  <g aria-label="W" transform="translate(360 0) scale(1.07 1) translate(-360 0)">
    <path class="pencil" d="M100 30 C105 43 111 59 123 73 C135 62 144 47 151 35 C157 50 164 63 177 74 C188 58 197 42 205 28"/>
    <path class="ink" d="M98 27 C103 42 110 58 122 72 C134 61 143 46 150 34 C155 49 163 62 176 72 C187 57 196 41 203 26"/>
  </g>

