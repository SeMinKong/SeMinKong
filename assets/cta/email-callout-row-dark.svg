<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="email-title email-desc">
  <title id="email-title">Email 바로가기</title>
  <desc id="email-desc">손으로 쓴 Email과 세 개의 화살표가 이메일 버튼을 가리킵니다.</desc>
  <style>
    .ink{fill:none;stroke:#D9E2F0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pencil{fill:none;stroke:#708090;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#E16B61;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#3A1D1A;stroke:#E16B61;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}.label{fill:#EDF4FA;font:700 40px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}.d1{animation-delay:.10s}.d2{animation-delay:.35s}.d3{animation-delay:.60s}.tip{opacity:0;animation:reveal .12s ease-out forwards}.t1{animation-delay:1.35s}.t2{animation-delay:1.60s}.t3{animation-delay:1.85s}@keyframes draw{to{stroke-dashoffset:0}}@keyframes reveal{to{opacity:1}}@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.tip{animation:none;opacity:1}}
  </style>

  <g aria-label="EMAIL">
