    <path class="ink" d="M101 27 C99 42 99 59 101 75 M102 28 C123 27 147 24 168 22 M101 49 C120 49 137 48 154 48 M101 74 C123 77 148 73 170 68 M204 75 C203 58 204 42 206 27 C220 40 235 55 246 65 C257 52 269 39 283 27 C285 42 286 58 287 74 M321 75 C332 54 345 35 360 23 C376 38 389 57 400 75 M337 55 C351 53 372 54 386 56 M439 25 C452 27 467 25 479 22 M459 25 C457 42 457 59 459 73 M441 75 C453 73 468 74 480 71 M519 27 C517 43 517 59 520 74 C551 76 586 73 620 68"/>
  </g>

