<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="web-title web-desc">
  <title id="web-title">Web 포트폴리오 바로가기</title>
  <desc id="web-desc">손으로 그린 W, E, B와 세 개의 화살표가 프로젝트와 작업 기록을 볼 수 있는 포트폴리오 버튼을 가리킵니다.</desc>
  <style>
    .ink{fill:none;stroke:#D9E2F0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pencil{fill:none;stroke:#708090;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#58C7AC;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#12312C;stroke:#58C7AC;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}.label{fill:#EDF4FA;font:700 26px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}.d1{animation-delay:.10s}.d2{animation-delay:.35s}.d3{animation-delay:.60s}.tip{opacity:0;animation:reveal .12s ease-out forwards}.t1{animation-delay:1.35s}.t2{animation-delay:1.60s}.t3{animation-delay:1.85s}@keyframes draw{to{stroke-dashoffset:0}}@keyframes reveal{to{opacity:1}}@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.tip{animation:none;opacity:1}}
  </style>

