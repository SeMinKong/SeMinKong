<svg xmlns="http://www.w3.org/2000/svg" width="720" height="248" viewBox="0 0 720 248" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="email-title email-desc">
  <title id="email-title">Email 바로가기</title>
  <desc id="email-desc">손으로 쓴 Email 아래의 손그림 강조선이 이메일 버튼을 둘러쌉니다.</desc>
  <style>
    .ink{fill:none;stroke:#26344A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pencil{fill:none;stroke:#7B8798;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.burst{fill:none;stroke:#B3261E;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.96}.panel{fill:#F8E9E7;stroke:#B3261E;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}.label{fill:#26344A;font:700 40px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.15s cubic-bezier(.2,.7,.2,1) .12s forwards}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
  </style>

