    <path class="ink" d="M328 26 C327 41 327 59 329 73 M329 27 C352 27 374 22 394 19 M330 47 C349 47 366 46 381 47 M329 72 C351 75 376 70 396 66"/>
  </g>

  <g aria-label="B" transform="translate(360 0) scale(1.07 1) translate(-360 0)">
    <path class="pencil" d="M530 27 C529 42 529 60 531 77 M532 28 C553 21 580 20 589 27 C599 36 580 46 551 49 M551 49 C580 48 595 56 591 66 C587 77 557 79 532 75"/>
    <path class="ink" d="M527 25 C526 42 526 59 529 75 M529 26 C551 20 578 18 588 25 C598 34 578 44 549 47 M549 47 C579 46 594 54 589 64 C584 75 555 77 529 73"/>
  </g>

  <path class="burst draw" pathLength="1" aria-label="버튼을 감싸는 손그림 강조선" d="M128 136 C151 130 169 118 172 102 C185 117 199 127 221 128 C239 129 252 121 263 108 C275 124 290 132 313 133 C338 134 358 130 377 120 C380 136 393 143 417 142 C443 141 464 132 486 116 C495 132 510 141 535 143 C557 145 575 140 592 130 C604 143 606 153 592 162 C580 170 589 178 618 185 C589 191 571 200 580 214 C550 207 522 204 503 216 C484 202 463 201 448 219 C429 207 414 205 398 218 C383 202 365 200 350 217 C331 205 314 207 299 220 C278 209 254 205 237 216 C215 202 193 198 168 202 C180 189 174 179 145 168 C163 157 153 147 128 136 Z"/>

  <g aria-label="Web 포트폴리오 열기">
    <path class="panel" d="M220 148 C292 146 420 149 500 147 L499 209 C414 210 304 208 221 210 Z"/>
    <path class="pencil" d="M223 151 C299 149 417 152 497 150 L496 206 C413 207 307 206 224 207 Z"/>
    <text class="label" x="360" y="188" text-anchor="middle">PORTFOLIO ↗</text>
