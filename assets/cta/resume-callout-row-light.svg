<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="resume-title resume-desc">
  <title id="resume-title">Resume 바로가기</title>
